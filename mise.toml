# Tap class: the homebrew unit's bare `brew audit` resolves formulae through a
# linked tap, so CI links this checkout before auditing.
[tasks."brew:tap-local"]
description = "Link this checkout as a trusted tap so bare brew audit resolves it"
run = "tap_dir=\"$(brew --repo)/Library/Taps/tailrocks\" && mkdir -p \"$tap_dir\" && ln -sfn \"$PWD\" \"$tap_dir/homebrew-velnor\" && brew trust tailrocks/velnor"
